<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img">
  <title>工作流程</title>
  <rect width="900" height="300" fill="#F8FAFC"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#14B8A6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <rect x="50" y="56" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1"/>
    <text x="135" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">① 监听双击</text>
    <text x="135" y="102" text-anchor="middle" font-size="12" fill="#64748B">系统级鼠标事件</text>

    <line x1="222" y1="88" x2="248" y2="88" stroke="#14B8A6" stroke-width="1.8" marker-end="url(#a)"/>

    <rect x="250" y="56" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1"/>
    <text x="335" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">② 前台是浏览器？</text>
    <text x="335" y="102" text-anchor="middle" font-size="12" fill="#64748B">比对 bundle id</text>

    <line x1="422" y1="88" x2="448" y2="88" stroke="#14B8A6" stroke-width="1.8" marker-end="url(#a)"/>

    <rect x="450" y="56" width="170" height="64" rx="10" fill="#FFFFFF" stroke="#14B8A6" stroke-width="1"/>
    <text x="535" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">③ 落在标签栏？</text>
    <text x="535" y="102" text-anchor="middle" font-size="12" fill="#64748B">按浏览器取参数</text>

    <line x1="622" y1="88" x2="648" y2="88" stroke="#14B8A6" stroke-width="1.8" marker-end="url(#a)"/>

    <rect x="650" y="56" width="200" height="64" rx="10" fill="#E6F7F4" stroke="#0F766E" stroke-width="1"/>
    <text x="750" y="82" text-anchor="middle" font-size="14" font-weight="600" fill="#0F766E">④ 发送 ⌘W</text>
    <text x="750" y="102" text-anchor="middle" font-size="12" fill="#0F766E">目标标签被关闭</text>

    <rect x="50" y="170" width="800" height="70" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="76" y="200" font-size="14" font-weight="600" fill="#334155">任何一步判断为否 → 直接返回，什么都不做</text>
    <text x="76" y="222" font-size="12" fill="#64748B">因此在访达、编辑器、聊天软件里双击，行为与安装前完全一致；工具也不联网、不上报任何数据</text>

    <text x="50" y="278" font-size="12" fill="#94A3B8">仅需「辅助功能」权限：macOS 不提供按 App 隔离的系统级鼠标监听接口</text>
  </g>
</svg>
