<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img">
  <title>一键校准标签栏示意</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect width="900" height="360" fill="#F8FAFC"/>

  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <text x="40" y="46" font-size="16" font-weight="600" fill="#0F172A">换浏览器、换标签栏样式，双击一次就量准</text>
    <text x="40" y="70" font-size="13" fill="#64748B">不用再去日志里算「点击 y − 窗口 y」</text>
  </g>

  <!-- 浏览器窗口 mock -->
  <g>
    <rect x="40" y="92" width="470" height="230" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- 标题栏 + 红绿灯 -->
    <path d="M40 102 a10 10 0 0 1 10 -10 h450 a10 10 0 0 1 10 10 v26 h-470 z" fill="#EEF2F7"/>
    <circle cx="60" cy="110" r="5" fill="#FF5F57"/>
    <circle cx="76" cy="110" r="5" fill="#FEBC2E"/>
    <circle cx="92" cy="110" r="5" fill="#28C840"/>

    <!-- 标签栏 -->
    <rect x="40" y="128" width="470" height="34" fill="#E7EDF4"/>
    <rect x="110" y="130" width="120" height="30" rx="7" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="170" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#334155">标签 A</text>
    <rect x="236" y="130" width="120" height="30" rx="7" fill="#DCE6F0"/>
    <text x="296" y="150" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">标签 B</text>
    <text x="374" y="151" font-family="-apple-system, sans-serif" font-size="16" fill="#64748B">+</text>

    <!-- 内容区 -->
    <rect x="40" y="162" width="470" height="160" fill="#FFFFFF"/>
    <rect x="66" y="186" width="300" height="9" rx="4" fill="#E2E8F0"/>
    <rect x="66" y="206" width="380" height="9" rx="4" fill="#E2E8F0"/>
    <rect x="66" y="226" width="250" height="9" rx="4" fill="#E2E8F0"/>
    <rect x="66" y="246" width="330" height="9" rx="4" fill="#EEF2F7"/>

    <!-- 双击点 -->
    <circle cx="170" cy="145" r="10" fill="none" stroke="#0F766E" stroke-width="2.5"/>
    <circle cx="170" cy="145" r="3.5" fill="#0F766E"/>
    <text x="188" y="126" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#0F766E">双击这里</text>

    <!-- 窗口顶边参考线 -->
    <line x1="24" y1="92" x2="540" y2="92" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="556" y="88" font-family="-apple-system, sans-serif" font-size="10" fill="#94A3B8">窗口顶边</text>

    <!-- 高度标尺 -->
    <line x1="530" y1="92" x2="530" y2="145" stroke="#0F766E" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="540" y="122" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#0F766E">53 px</text>
  </g>

  <!-- 结果卡片 -->
  <g font-family="-apple-system, 'PingFang SC', sans-serif">
    <rect x="620" y="92" width="250" height="230" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="644" y="124" font-size="12" fill="#94A3B8">测量结果</text>
    <text x="644" y="152" font-size="14" font-weight="600" fill="#0F172A">距窗口顶部 53 px</text>

    <line x1="644" y1="168" x2="846" y2="168" stroke="#E6EDF3"/>

    <text x="644" y="192" font-size="12" fill="#94A3B8">自动加 14 px 余量</text>
    <text x="644" y="216" font-size="13" fill="#0F172A">tabHeight = 53 + 14</text>
    <text x="644" y="244" font-size="18" font-weight="700" fill="#0F766E">= 67 px</text>

    <rect x="644" y="262" width="200" height="40" rx="8" fill="#ECFDF5"/>
    <text x="660" y="280" font-size="11" fill="#047857">已写入 config.json</text>
    <text x="660" y="294" font-size="11" fill="#047857">立即生效 · 无需重新授权</text>
  </g>
</svg>
