<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img">
  <title>双击标签关闭标签页示意</title>
  <rect width="900" height="400" fill="#F8FAFC"/>

  <g>
    <rect x="50" y="40" width="800" height="240" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

    <circle cx="76" cy="66" r="6" fill="#FC5C57"/>
    <circle cx="96" cy="66" r="6" fill="#FDBC40"/>
    <circle cx="116" cy="66" r="6" fill="#33C748"/>

    <rect x="146" y="52" width="118" height="30" rx="7" fill="#F1F5F9"/>
    <rect x="272" y="52" width="118" height="30" rx="7" fill="#E6F7F4" stroke="#14B8A6" stroke-width="1"/>
    <rect x="398" y="52" width="118" height="30" rx="7" fill="#F1F5F9"/>
    <rect x="524" y="52" width="118" height="30" rx="7" fill="#F1F5F9"/>

    <text x="160" y="72" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#64748B">工作台</text>
    <text x="286" y="72" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#0F766E" font-weight="600">GitHub</text>
    <text x="412" y="72" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#64748B">文档</text>
    <text x="538" y="72" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#64748B">资讯</text>

    <line x1="50" y1="96" x2="850" y2="96" stroke="#E2E8F0" stroke-width="1"/>

    <rect x="86" y="122" width="220" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="86" y="148" width="420" height="10" rx="5" fill="#EEF2F6"/>
    <rect x="86" y="170" width="380" height="10" rx="5" fill="#EEF2F6"/>
    <rect x="86" y="192" width="440" height="10" rx="5" fill="#EEF2F6"/>
    <rect x="86" y="214" width="300" height="10" rx="5" fill="#EEF2F6"/>
    <rect x="86" y="236" width="360" height="10" rx="5" fill="#EEF2F6"/>

    <circle cx="457" cy="67" r="20" fill="none" stroke="#14B8A6" stroke-width="2.5"/>
    <circle cx="457" cy="67" r="32" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.4"/>
    <path d="M450 60 L450 78 L455 73 L459 81 L463 79 L459 71 L465 71 Z" fill="#0F172A"/>

    <text x="470" y="128" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#0F766E">双击标签</text>
    <text x="470" y="150" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#64748B">第一下激活标签，第二下判定关闭</text>
  </g>

  <g>
    <rect x="50" y="306" width="800" height="56" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
    <text x="76" y="331" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#065F46">结果</text>
    <text x="76" y="350" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#047857">被双击的那个标签被关闭，其余标签的位置和内容都不受影响</text>

    <text x="620" y="340" font-family="-apple-system, 'SF Mono', Menlo, monospace" font-size="13" fill="#059669">⌘W</text>
    <text x="660" y="340" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#059669">发送到当前前台浏览器</text>
  </g>
</svg>
